# cargo-mutants configuration. https://mutants.rs/
#
# Run locally:
#   cargo mutants                       # full run
#   cargo mutants --in-diff <(git diff main)  # only changed code
#
# The suite runs lib unit tests AND most integration tests under `tests/`
# (wycheproof, ACVP KATs, proptests, ctgrind). `libcrux_xtest` is excluded
# via the `mutants` nextest profile in `.config/nextest.toml` — it's the
# heaviest integration binary and its per-mutant cost is disproportionate.
# Requires `cargo-nextest` on PATH.

# nextest as the default test tool. CI assumes this.
test_tool = "nextest"

# Build profile for cargo-mutants's internal cargo invocations. Pairs with
# `[profile.mutants]` in Cargo.toml, which inherits release-checked but drops
# debuginfo — build time dominates per-mutant cost.
profile = "mutants"

# Seed each scratch build dir with the (rust-cache-warmed) `target/` so its
# first build isn't a cold dep recompile; pairs with `incremental`.
copy_target = true

# Run mutants with the internals exposed so the white-box property and unit
# tests (algebraic_properties, field/NTT/encoding) can kill arithmetic mutants,
# under the release-checked profile (debug-assertions + overflow-checks).
#
# Do not repeat `--cargo-profile` here — `profile = "mutants"` above already
# forwards it; passing it again makes nextest reject the build with
# `'--cargo-profile <NAME>' cannot be used multiple times`.
additional_cargo_test_args = ["--features", "expose-internals", "--profile", "mutants"]

# Timeout: 2x baseline with a 90s floor. The NTT rejection-sampling loops can
# spin on a mutated bound; the build/test timeouts cap those rather than
# annotating every loop predicate with `mutants::skip`. Baseline test runs
# finish in ~20s once opt-level=1 kicked in, and mutants that get killed by an
# assertion fire within a few seconds — so 90s is enough for slow proptests
# while cutting per-timeout dead time in half vs the prior 180s.
timeout_multiplier = 2.0
minimum_test_timeout = 90
build_timeout_multiplier = 3.0

# Keep this list minimal. A surviving mutant is a signal, not noise; only
# exclude where mutation *cannot* produce a meaningful test failure.
exclude_re = [
    # Debug formatting is a diagnostic aid, not a correctness property; mutating
    # it to a no-op fails no functional test.
    "impl Debug for",
    # `<` -> `<=` on `unpack`'s word-refill guard is equivalent: refilling one
    # value early shifts the same word to the same bit positions, so every
    # output (zero-padded tails included) is unchanged.
    "replace < with <= in unpack",
    # The SIMD dispatch in `encoding/arch`: mutating the size arithmetic of
    # the guard `bytes.len() != N * d / 8`, or deleting a width's match arm,
    # sends those inputs down the scalar fallback, which returns the same
    # values (slower, not wrong) — equivalent mutants.
    "encoding/arch/(neon|avx2)\\.rs.*: replace (\\*|/) with . in unpack",
    "encoding/arch/(neon|avx2)\\.rs.*: delete match arm .* in unpack",
    # `pack_controls`'s `idx_next` guards and byte indices only shape bits the
    # kernel's shift-and-mask discards (an out-of-window gather contributes
    # nothing an in-range shift can move into the kept byte), so mutating
    # them changes no output.
    "encoding/arch/(neon|avx2)\\.rs.*: replace < with <= in pack_controls",
    "encoding/arch/(neon|avx2)\\.rs.*: replace && with \\|\\| in pack_controls",
    "encoding/arch/(neon|avx2)\\.rs.*: replace \\+ with - in pack_controls",
    # Recombining disjoint bit ranges: `|` and `^` agree when no bits overlap.
    "sampling/arch/generic\\.rs.*: replace \\| with \\^ in reject",
    # The 16-byte window guard `start + 16`: mutations reroute loads to the
    # zero-padded fallback, which produces the same bytes.
    "sampling/arch/(neon|avx2)\\.rs.*: replace \\+ with \\* in reject",
    # One-past loop bound on the fixed 128-pair reduce: the extra iteration
    # reads and writes out of bounds, which no test can observe meaningfully.
    "poly/arch/avx2\\.rs.*: replace < with <= in basemul_reduce",
]
