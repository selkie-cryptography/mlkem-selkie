events {}
http {
    include mime.types;
    sendfile on;

    server {
        listen 8080;
        listen [::]:8080;
        port_in_redirect off;

        resolver 127.0.0.11;
        autoindex off;

        server_name _;
        server_tokens off;

        root /app;
        gzip_static on;

        # CI report artifacts published to the Fly volume by the workflows.
        location /coverage/ { alias /data/coverage/; }
        location /bench/ { alias /data/bench/; }
        location /instructions/ { alias /data/instructions/; }
        location /cycles/ { alias /data/cycles/; }
        location /mutants/ { alias /data/mutants/; }
        location /dudect/ { alias /data/dudect/; }
        location /tacet/ { alias /data/tacet/; }
        location /ctgrind/ { alias /data/ctgrind/; }
        location /kat/ { alias /data/kat/; }
        location /wycheproof/ { alias /data/wycheproof/; }
        location /deny/ { alias /data/deny/; }
        location /docs/ { alias /data/docs/; }
        location /flamegraphs/ { alias /data/flamegraphs/; }
        location /api/ { alias /data/api/; }

        location = /manifest.json { alias /data/manifest.json; }
        location = /head.json { alias /data/head.json; }

        error_page 404 /404.html;
        location = /404.html { internal; }

        location /metrics { stub_status on; }
    }
}
