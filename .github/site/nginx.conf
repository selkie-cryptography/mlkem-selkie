events {}
http {
    include mime.types;
    sendfile on;

    server {
        listen 8080;
        listen [::]:8080;
        port_in_redirect off;

        resolver 127.0.0.11;
        autoindex off;

        server_name _;
        server_tokens off;

        root /app;
        gzip_static on;

        # CI data kinds published to the Fly volume by ci-upload.rs. Keep in
        # sync with ALL_KINDS in .github/scripts/ci-upload.rs and the mkdir
        # list in entrypoint.sh.
        location /coverage/ { alias /data/coverage/; }
        location /bench-generic/ { alias /data/bench-generic/; }
        location /bench-avx2/ { alias /data/bench-avx2/; }
        location /bench-neon/ { alias /data/bench-neon/; }
        location /instructions-generic/ { alias /data/instructions-generic/; }
        location /instructions-avx2/ { alias /data/instructions-avx2/; }
        location /cycles-generic/ { alias /data/cycles-generic/; }
        location /cycles-avx2/ { alias /data/cycles-avx2/; }
        location /mutants/ { alias /data/mutants/; }
        location /mutants-aarch64/ { alias /data/mutants-aarch64/; }
        location /dudect/ { alias /data/dudect/; }
        location /tacet/ { alias /data/tacet/; }
        location /ctgrind/ { alias /data/ctgrind/; }
        location /deny/ { alias /data/deny/; }
        location /unsafe/ { alias /data/unsafe/; }
        location /platform/ { alias /data/platform/; }
        location /kat/ { alias /data/kat/; }

        # Rustdoc published by ci.yml's doc job (has its own index.html).
        location /rustdoc/ { alias /data/rustdoc/; }

        location = /manifest.json { alias /data/manifest.json; }
        location = /head.json { alias /data/head.json; }

        error_page 404 /404.html;
        location = /404.html { internal; }

        location /metrics { stub_status on; }
    }
}
