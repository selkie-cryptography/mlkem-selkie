name: Audit

# Runs on every commit, not just dependency changes: the release preflight
# requires a green Audit on the tagged commit, and a required check that
# conditionally never runs blocks the merge or the release instead.
on:
  push:
    branches: [main]
  pull_request:
  # Daily, so a new advisory surfaces within a day.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny (advisories, bans, licenses, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2
        with:
          command: check
      - name: Install cargo-deny for the dashboard report
        if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172  # v2.87.20
        with:
          tool: cargo-deny
      - name: Build dashboard JSON
        if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          rustc -O --edition 2021 .github/scripts/deny-report.rs -o /tmp/deny-report
          /tmp/deny-report "${{ github.sha }}" > deny.json
      - name: Upload to dashboard
        if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/ci-upload
        with:
          kind: deny
          payload: deny.json
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

  # Keeps one open issue while scheduled runs fail; closes it on the next
  # green scheduled run. The only job with a write token; it runs no cargo.
  report:
    name: Track audit issue
    needs: [cargo-deny]
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-report
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write  # open, comment on, and close the audit issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const { trackAll, legsFromNeeds } = require('./.github/scripts/track-issue.js');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await trackAll({ github, context, core }, [
              {
                key: 'audit/scheduled',
                label: 'scheduled-failure',
                title: 'Audit fails on the scheduled run',
                intro: 'The scheduled Audit run fails on the default branch. The run log has the details.',
                legs: legsFromNeeds(JSON.parse(process.env.NEEDS)),
                runUrl,
              },
            ]);
