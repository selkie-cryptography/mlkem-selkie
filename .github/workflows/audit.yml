name: Audit

# Runs on every commit, not just dependency changes: the release preflight
# requires a green Audit on the tagged commit, and a required check that
# conditionally never runs blocks the merge or the release instead.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny (advisories, bans, licenses, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - name: Install cargo-deny for the dashboard report
        if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: taiki-e/install-action@cargo-deny
      - name: Build dashboard JSON
        if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          rustc -O --edition 2021 .github/scripts/deny-report.rs -o /tmp/deny-report
          /tmp/deny-report "${{ github.sha }}" > deny.json
      - name: Upload to dashboard
        if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/ci-upload
        with:
          kind: deny
          payload: deny.json
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}
