name: Audit

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
      - ".github/workflows/audit.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny (advisories, bans, licenses, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - name: Capture deny report for dashboard
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: taiki-e/install-action@cargo-deny
      - name: Run + capture
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cargo deny check 2>&1 | tee deny.txt || true
      - name: Publish to dashboard
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/ci-publish
        with:
          path: deny.txt
          dest: deny
          status: ok
          summary: advisories · bans · licenses · sources
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}
