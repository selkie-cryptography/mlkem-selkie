name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "benches/**"
      - ".github/workflows/bench.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# `bench-diff-comment` opens a sticky comment on the PR that owns the run, so
# the workflow needs write access to pull requests. The dashboard-upload leg
# only writes to Fly, not to GitHub, so it stays on the default `contents:
# read`.

jobs:
  benchmarks:
    name: divan (${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # One run per polynomial backend build.rs selects (see ci.yml's test
      # matrices): generic on baseline x86, AVX2 with target-cpu=v3, NEON on the
      # aarch64 macOS runner.
      matrix:
        include:
          - { backend: generic, os: ubuntu-latest, rustflags: "" }
          - { backend: avx2, os: ubuntu-latest, rustflags: "-C target-cpu=x86-64-v3" }
          - { backend: neon, os: macos-latest, rustflags: "" }
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - name: Signal running
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          rustc -O --edition 2021 .github/scripts/ci-signal.rs -o /tmp/ci-signal
          /tmp/ci-signal "bench-${{ matrix.backend }}" running "${{ github.sha }}"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Public API (keygen / encaps / decaps)
        run: |
          set -o pipefail
          mkdir -p bench
          cargo bench --bench mlkem | tee bench/mlkem.txt
      - name: Internal hot paths (NTT / sampling / encoding)
        run: |
          set -o pipefail
          cargo bench --bench algebraic --features expose-internals | tee bench/algebraic.txt
      - name: Build dashboard JSON
        run: |
          rustc -O --edition 2021 .github/scripts/divan-to-json.rs -o /tmp/divan-to-json
          cat bench/mlkem.txt bench/algebraic.txt | /tmp/divan-to-json > bench-flat.json
          # Group `mlkem::keygen::MLKEM768`-style names into the payload the
          # dashboard's bench panel reads; summary carries the ML-KEM-768
          # medians the trend charts key on.
          jq -n --arg sha "${{ github.sha }}" --argjson benches "$(cat bench-flat.json)" '{
            sha: $sha,
            updated_at: (now | todate),
            groups: (
              $benches
              | group_by(.name | split("::")[0])
              | map({
                  name: (.[0].name | split("::")[0]),
                  benchmarks: map({
                    name: (.name | split("::")[1:] | join("::")),
                    time_ns: .median_ns,
                    median_ns, fastest_ns, slowest_ns, mean_ns, samples, iters
                  })
                })
            ),
            summary: {
              keygen_ns: ([$benches[] | select(.name == "mlkem::keygen::MLKEM768") | .median_ns] | first),
              encaps_ns: ([$benches[] | select(.name == "mlkem::encaps::MLKEM768") | .median_ns] | first),
              decaps_ns: ([$benches[] | select(.name == "mlkem::decaps::MLKEM768") | .median_ns] | first)
            }
          }' > bench.json
      - name: Verify bench payload has data
        run: |
          groups=$(jq '.groups | length' bench.json)
          benches=$(jq '[.groups[].benchmarks[]] | length' bench.json)
          echo "bench.json: $groups groups, $benches benchmarks."
          if [ "$groups" -eq 0 ] || [ "$benches" -eq 0 ]; then
            echo "::error::bench.json has no benchmark data."
            cat bench.json >&2 || true
            exit 1
          fi
      - name: Stage payload for bench-diff
        # Rename to include the backend so the bench-diff aggregator can drop
        # every leg's payload into one flat directory without name collisions.
        run: |
          mkdir -p payload
          cp bench.json payload/bench-${{ matrix.backend }}.json
      - name: Upload head payload artifact
        uses: actions/upload-artifact@v4
        with:
          name: perf-payload-bench-${{ matrix.backend }}
          path: payload/bench-${{ matrix.backend }}.json
          retention-days: 3
      - name: Save baseline cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: payload/bench-${{ matrix.backend }}.json
          key: perf-baseline-bench-${{ matrix.backend }}-${{ github.sha }}
      - name: Upload to dashboard
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/ci-upload
        with:
          kind: bench-${{ matrix.backend }}
          payload: bench.json
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

  instructions:
    name: gungraun instruction counts (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # x86_64 only (Valgrind/callgrind): generic baseline and the AVX2 backend.
      matrix:
        include:
          - { backend: generic, rustflags: "" }
          - { backend: avx2, rustflags: "-C target-cpu=x86-64-v3" }
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Valgrind + gungraun-runner
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind
          cargo install gungraun-runner --version 0.19.2 --locked
      - name: Run instruction counts
        # --save-summary writes per-bench summary.json trees under
        # target/gungraun, which instructions-report parses for the dashboard.
        run: |
          set -o pipefail
          cargo bench --bench instructions --features expose-internals -- --save-summary=json | tee instructions.txt
      - name: Build dashboard JSON
        run: |
          rustc -O --edition 2021 .github/scripts/instructions-report.rs -o /tmp/instructions-report
          /tmp/instructions-report target/gungraun "${{ github.sha }}" > instructions.json
      - name: Verify instructions payload has data
        run: jq -e '.total > 0 and (.results | length > 0)' instructions.json > /dev/null || { echo "::error::instructions.json has no benchmark results"; cat instructions.json >&2; exit 1; }
      - name: Stage payload for bench-diff
        run: |
          mkdir -p payload
          cp instructions.json payload/instructions-${{ matrix.backend }}.json
      - name: Upload head payload artifact
        uses: actions/upload-artifact@v4
        with:
          name: perf-payload-instructions-${{ matrix.backend }}
          path: payload/instructions-${{ matrix.backend }}.json
          retention-days: 3
      - name: Save baseline cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: payload/instructions-${{ matrix.backend }}.json
          key: perf-baseline-instructions-${{ matrix.backend }}-${{ github.sha }}
      - name: Upload to dashboard
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/ci-upload
        with:
          kind: instructions-${{ matrix.backend }}
          payload: instructions.json
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

  cycles:
    name: rdtsc megacycles (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # rdtsc is x86_64 only: generic baseline and the AVX2 backend.
      matrix:
        include:
          - { backend: generic, rustflags: "" }
          - { backend: avx2, rustflags: "-C target-cpu=x86-64-v3" }
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run cycle counts
        run: |
          set -o pipefail
          cargo bench --bench cycles --features expose-internals | tee cycles.txt
      - name: Build dashboard JSON
        run: |
          rustc -O --edition 2021 .github/scripts/cycles-to-json.rs -o /tmp/cycles-to-json
          /tmp/cycles-to-json target/criterion "${{ github.sha }}" > cycles.json
      - name: Verify cycles payload has data
        run: jq -e '.results | length > 0' cycles.json > /dev/null || { echo "::error::cycles.json has no benchmark results"; cat cycles.json >&2; exit 1; }
      - name: Stage payload for bench-diff
        run: |
          mkdir -p payload
          cp cycles.json payload/cycles-${{ matrix.backend }}.json
      - name: Upload head payload artifact
        uses: actions/upload-artifact@v4
        with:
          name: perf-payload-cycles-${{ matrix.backend }}
          path: payload/cycles-${{ matrix.backend }}.json
          retention-days: 3
      - name: Save baseline cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: payload/cycles-${{ matrix.backend }}.json
          key: perf-baseline-cycles-${{ matrix.backend }}-${{ github.sha }}
      - name: Upload to dashboard
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/ci-upload
        with:
          kind: cycles-${{ matrix.backend }}
          payload: cycles.json
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

  # PR-only aggregator: joins the current run's payloads against the newest
  # cached main-branch baselines and posts one sticky comment per PR with the
  # combined diff. Independent of the dashboard-upload path.
  bench-diff-comment:
    name: Benchmarks (PR comment)
    if: github.event_name == 'pull_request'
    needs: [benchmarks, instructions, cycles]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download head payloads
        uses: actions/download-artifact@v4
        with:
          pattern: perf-payload-*
          path: head/
          merge-multiple: true
      # One cache entry per (kind, backend), each keyed on the baseline sha we
      # want to compare against. `restore-keys` walks back to the newest match
      # for the prefix so a PR gets a diff on any recent main-branch build.
      # A miss on one leg is not fatal — bench-diff.rs simply omits its row.
      - name: Restore baseline (bench, generic)
        uses: actions/cache/restore@v4
        with:
          path: baseline/bench-generic.json
          key: perf-baseline-bench-generic-${{ github.event.pull_request.base.sha }}
          restore-keys: perf-baseline-bench-generic-
      - name: Restore baseline (bench, avx2)
        uses: actions/cache/restore@v4
        with:
          path: baseline/bench-avx2.json
          key: perf-baseline-bench-avx2-${{ github.event.pull_request.base.sha }}
          restore-keys: perf-baseline-bench-avx2-
      - name: Restore baseline (bench, neon)
        uses: actions/cache/restore@v4
        with:
          path: baseline/bench-neon.json
          key: perf-baseline-bench-neon-${{ github.event.pull_request.base.sha }}
          restore-keys: perf-baseline-bench-neon-
      - name: Restore baseline (instructions, generic)
        uses: actions/cache/restore@v4
        with:
          path: baseline/instructions-generic.json
          key: perf-baseline-instructions-generic-${{ github.event.pull_request.base.sha }}
          restore-keys: perf-baseline-instructions-generic-
      - name: Restore baseline (instructions, avx2)
        uses: actions/cache/restore@v4
        with:
          path: baseline/instructions-avx2.json
          key: perf-baseline-instructions-avx2-${{ github.event.pull_request.base.sha }}
          restore-keys: perf-baseline-instructions-avx2-
      - name: Restore baseline (cycles, generic)
        uses: actions/cache/restore@v4
        with:
          path: baseline/cycles-generic.json
          key: perf-baseline-cycles-generic-${{ github.event.pull_request.base.sha }}
          restore-keys: perf-baseline-cycles-generic-
      - name: Restore baseline (cycles, avx2)
        uses: actions/cache/restore@v4
        with:
          path: baseline/cycles-avx2.json
          key: perf-baseline-cycles-avx2-${{ github.event.pull_request.base.sha }}
          restore-keys: perf-baseline-cycles-avx2-
      - uses: dtolnay/rust-toolchain@stable
      - name: Build markdown diff
        run: |
          rustc -O --edition 2021 .github/scripts/bench-diff.rs -o /tmp/bench-diff
          mkdir -p baseline  # in case every restore missed
          /tmp/bench-diff baseline head "${{ github.event.pull_request.base.sha }}" > bench-diff.md
          cat bench-diff.md
      - name: Post sticky PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('bench-diff.md', 'utf8');
            const marker = '<!-- bench-diff-marker -->';

            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {owner, repo, issue_number, per_page: 100},
            );
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }
