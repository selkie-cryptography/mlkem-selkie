name: Perf

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "benches/**"
      - ".github/workflows/perf.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmarks:
    name: divan wall-clock benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Public API (keygen / encaps / decaps)
        run: cargo bench --bench mlkem
      - name: Internal hot paths (NTT / sampling / encoding)
        run: cargo bench --bench algebraic --features expose-internals

  instructions:
    name: gungraun callgrind instruction counts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Valgrind + gungraun-runner
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind
          cargo install gungraun-runner --version 0.19.2 --locked
      - run: cargo bench --bench instructions --features expose-internals

  cycles:
    name: rdtsc megacycles (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --bench cycles --features expose-internals
