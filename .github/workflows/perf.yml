name: Perf

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "benches/**"
      - ".github/workflows/perf.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmarks:
    name: divan (${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # One run per polynomial backend build.rs selects (see ci.yml's test
      # matrices): generic on baseline x86, AVX2 with target-cpu=v3, NEON on the
      # aarch64 macOS runner.
      matrix:
        include:
          - { backend: generic, os: ubuntu-latest, rustflags: "" }
          - { backend: avx2, os: ubuntu-latest, rustflags: "-C target-cpu=x86-64-v3" }
          - { backend: neon, os: macos-latest, rustflags: "" }
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Public API (keygen / encaps / decaps)
        run: |
          set -o pipefail
          mkdir -p bench
          cargo bench --bench mlkem | tee bench/mlkem.txt
      - name: Internal hot paths (NTT / sampling / encoding)
        run: |
          set -o pipefail
          cargo bench --bench algebraic --features expose-internals | tee bench/algebraic.txt
      - name: Publish to dashboard
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/ci-publish
        with:
          path: bench
          dest: bench-${{ matrix.backend }}
          status: ok
          summary: divan wall-clock medians (${{ matrix.backend }})
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

  instructions:
    name: gungraun instruction counts (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # x86_64 only (Valgrind/callgrind): generic baseline and the AVX2 backend.
      matrix:
        include:
          - { backend: generic, rustflags: "" }
          - { backend: avx2, rustflags: "-C target-cpu=x86-64-v3" }
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Valgrind + gungraun-runner
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind
          cargo install gungraun-runner --version 0.19.2 --locked
      - name: Run instruction counts
        run: |
          set -o pipefail
          cargo bench --bench instructions --features expose-internals | tee instructions.txt
      - name: Publish to dashboard
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/ci-publish
        with:
          path: instructions.txt
          dest: instructions-${{ matrix.backend }}
          status: ok
          summary: gungraun instruction counts (${{ matrix.backend }})
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

  cycles:
    name: rdtsc megacycles (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # rdtsc is x86_64 only: generic baseline and the AVX2 backend.
      matrix:
        include:
          - { backend: generic, rustflags: "" }
          - { backend: avx2, rustflags: "-C target-cpu=x86-64-v3" }
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run cycle counts
        run: |
          set -o pipefail
          cargo bench --bench cycles --features expose-internals | tee cycles.txt
      - name: Publish to dashboard
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/ci-publish
        with:
          path: cycles.txt
          dest: cycles-${{ matrix.backend }}
          status: ok
          summary: rdtsc megacycles (${{ matrix.backend }})
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}
