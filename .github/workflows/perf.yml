name: Perf

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "benches/**"
      - ".github/workflows/perf.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmarks:
    name: divan wall-clock benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Public API (keygen / encaps / decaps)
        run: |
          set -o pipefail
          mkdir -p bench
          cargo bench --bench mlkem | tee bench/mlkem.txt
      - name: Internal hot paths (NTT / sampling / encoding)
        run: |
          set -o pipefail
          cargo bench --bench algebraic --features expose-internals | tee bench/algebraic.txt
      - name: Publish to dashboard
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/ci-publish
        with:
          path: bench
          dest: bench
          status: ok
          summary: divan wall-clock medians
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

  instructions:
    name: gungraun callgrind instruction counts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Valgrind + gungraun-runner
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind
          cargo install gungraun-runner --version 0.19.2 --locked
      - name: Run instruction counts
        run: |
          set -o pipefail
          cargo bench --bench instructions --features expose-internals | tee instructions.txt
      - name: Publish to dashboard
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/ci-publish
        with:
          path: instructions.txt
          dest: instructions
          status: ok
          summary: gungraun instruction counts
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

  cycles:
    name: rdtsc megacycles (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run cycle counts
        run: |
          set -o pipefail
          cargo bench --bench cycles --features expose-internals | tee cycles.txt
      - name: Publish to dashboard
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/ci-publish
        with:
          path: cycles.txt
          dest: cycles
          status: ok
          summary: rdtsc megacycles (x86_64)
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}
