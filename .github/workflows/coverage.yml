name: Coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: llvm-cov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - name: Signal running
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          rustc -O --edition 2021 .github/scripts/ci-signal.rs -o /tmp/ci-signal
          /tmp/ci-signal coverage running "${{ github.sha }}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: Collect coverage (lib + integration tests, internals exposed)
        run: cargo llvm-cov --features expose-internals --lcov --output-path lcov.info
      - name: Gate on coverage floor
        run: |
          cargo llvm-cov report \
            --fail-under-lines 95 \
            --fail-under-functions 94 \
            --fail-under-regions 96
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
      - name: Generate dashboard JSON
        run: |
          rustc -O --edition 2021 .github/scripts/lcov-to-json.rs -o /tmp/lcov-to-json
          /tmp/lcov-to-json lcov.info "${{ github.sha }}" > coverage.json
      - name: Verify coverage payload has data
        run: jq -e '(.total.total // 0) > 0 and (.modules | length > 0)' coverage.json > /dev/null || { echo "::error::coverage.json has no module data"; head -c 2000 coverage.json >&2; exit 1; }
      - name: Upload to dashboard
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/ci-upload
        with:
          kind: coverage
          payload: coverage.json
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}
