name: Coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: llvm-cov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: Collect coverage (lib + integration tests, internals exposed)
        run: cargo llvm-cov --features expose-internals --lcov --output-path lcov.info
      - name: Coverage summary
        run: cargo llvm-cov report --features expose-internals
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
