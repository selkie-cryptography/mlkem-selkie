name: Coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: llvm-cov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
          # Full history so diff-cover can compare the PR against its base.
          fetch-depth: 0
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1  # master
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - name: Signal running
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          rustc -O --edition 2021 .github/scripts/ci-signal.rs -o /tmp/ci-signal
          /tmp/ci-signal coverage running "${{ github.sha }}"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29  # v2.87.21
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
      - name: Collect coverage (lib + integration tests, internals exposed)
        run: cargo llvm-cov --locked --features expose-internals --lcov --output-path lcov.info
      - name: Gate on coverage floor
        run: |
          cargo llvm-cov report \
            --fail-under-lines 95 \
            --fail-under-functions 94 \
            --fail-under-regions 96
      - name: Gate on diff coverage (PRs only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          python3 -m pip install --quiet diff-cover
          diff-cover lcov.info \
            --compare-branch="origin/$BASE_REF" \
            --fail-under=95 \
            --show-uncovered
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-lcov
          path: lcov.info
      - name: Generate dashboard JSON
        run: |
          rustc -O --edition 2021 .github/scripts/lcov-to-json.rs -o /tmp/lcov-to-json
          /tmp/lcov-to-json lcov.info "${{ github.sha }}" > coverage.json
      - name: Verify coverage payload has data
        run: jq -e '(.total.total // 0) > 0 and (.modules | length > 0)' coverage.json > /dev/null || { echo "::error::coverage.json has no module data"; head -c 2000 coverage.json >&2; exit 1; }
      - name: Upload to dashboard
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/ci-upload
        with:
          kind: coverage
          payload: coverage.json
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}
