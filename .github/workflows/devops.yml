name: devops

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  actionlint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: reviewdog/action-actionlint@d63ba7532e0942965320cd8d73cbae4c7b3c5283  # v1.73.1
        with:
          level: warning
          fail_on_error: false

  # Fails when release.yml's RELEASE_TOOLCHAIN and ci.yml's pinned test leg
  # disagree, or Cargo.toml's rust-version exceeds the pin.
  toolchain-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master
        with:
          toolchain: stable
      - name: Toolchain pins agree
        run: |
          rustc -O --edition 2021 .github/scripts/toolchain-drift.rs -o /tmp/toolchain-drift
          /tmp/toolchain-drift consistency
