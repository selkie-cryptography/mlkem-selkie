name: devops

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  actionlint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: reviewdog/action-actionlint@b0a6aebe1d2191decc9b4f022cdfc248b702477d  # v1.42.0
        with:
          level: warning
          fail_on_error: false

  # Fails when release.yml's RELEASE_TOOLCHAIN and ci.yml's pinned test leg
  # disagree, or Cargo.toml's rust-version exceeds the pin.
  toolchain-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master
        with:
          toolchain: stable
      - name: Toolchain pins agree
        run: |
          rustc -O --edition 2021 .github/scripts/toolchain-drift.rs -o /tmp/toolchain-drift
          /tmp/toolchain-drift consistency

  # Audits workflows, composite actions, and dependabot.yml. Fails on any
  # finding; accepted ones are in .github/zizmor.yml.
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Online audits (impostor commits, known-vulnerable actions) use the
      # read-only GITHUB_TOKEN. Annotations instead of SARIF, which needs
      # `security-events: write`.
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482  # v0.6.4
        with:
          version: 1.30.1
          config: .github/zizmor.yml
          advanced-security: false
          annotations: true
