name: Constant-time

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "benches/dudect.rs"
      - "benches/tacet.rs"
      - "tests/ctgrind.rs"
      - "src/**"
      - ".github/workflows/ct.yml"
  schedule:
    # Weekly, to track the CT signal over time on the dashboard.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  statistical:
    name: dudect + tacet
    runs-on: ubuntu-latest
    # The CT rework has landed: dudect (encaps + decaps) clears |t| < 4.5
    # locally and ctgrind catches secret-dependent branches in keygen and
    # decaps. A regression here should fail the build.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build dudect bench
        run: cargo bench --bench dudect --features expose-internals --no-run
      - name: dudect t-test
        run: |
          # Run the bench binary directly: `cargo bench --bench` passes
          # `--bench` to the harness, which dudect-bencher rejects.
          set -o pipefail
          mkdir -p ct
          bin=$(find target/release/deps -maxdepth 1 -type f -name 'dudect-*' ! -name '*.d' -perm -u+x | head -1)
          "$bin" 2>&1 | tee ct/dudect.txt
      - name: Enforce dudect |t| < 4.5
        run: |
          # dudect-bencher prints `max t = <signed float>` per bench but always
          # exits 0; scrape the report and fail if any reading is at or above
          # the 4.5 threshold (or non-numeric, which means the harness broke).
          awk '
            /max t = / {
              match($0, /max t = [+-]?[0-9]+\.[0-9]+/);
              t = substr($0, RSTART + 8, RLENGTH - 8) + 0;
              if (t < 0) t = -t;
              printf "  %s -> |t| = %.5f\n", $2, t;
              if (t >= 4.5) { print "FAIL: |t| >= 4.5"; bad = 1 }
            }
            END { exit bad ? 1 : 0 }
          ' ct/dudect.txt
      - name: Build tacet bench
        run: cargo bench --bench tacet --features expose-internals --no-run
      - name: tacet attacker-model analysis
        run: |
          set -o pipefail
          bin=$(find target/release/deps -maxdepth 1 -type f -name 'tacet-*' ! -name '*.d' -perm -u+x | head -1)
          "$bin" 2>&1 | tee ct/tacet.txt
      - name: Publish to dashboard
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/ci-publish
        with:
          path: ct/dudect.txt
          dest: dudect
          status: ok
          summary: encaps + decaps |t| < 4.5
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}
      - name: Publish tacet to dashboard
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/ci-publish
        with:
          path: ct/tacet.txt
          dest: tacet
          status: ok
          summary: attacker-model leak analysis
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

  ctgrind:
    name: ctgrind (Valgrind taint tracking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind
      - name: Build ctgrind test
        # Release: debug-mode overflow checks insert conditional jumps that
        # Valgrind flags as secret-dependent (e.g. `v * BARRETT_DIV_Q` in
        # `FieldElement::new`). Release matches production and tests the
        # actual generated code.
        # `crabgrind` (the Valgrind client-request wrapper) is a Linux-only
        # optional regular dep; enable it alongside `ctgrind` here so
        # `K-PKE.KeyGen` can declassify `rho` under memcheck.
        run: cargo test --test ctgrind --features ctgrind,crabgrind --release --no-run
      - name: Run under memcheck
        run: |
          set -o pipefail
          bin=$(find target/release/deps -maxdepth 1 -type f -name 'ctgrind-*' ! -name '*.d' -perm -u+x | head -1)
          echo "running $bin under valgrind"
          valgrind --tool=memcheck --error-exitcode=1 "$bin" --test-threads=1 2>&1 | tee ctgrind.txt
      - name: Publish to dashboard
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: ./.github/actions/ci-publish
        with:
          path: ctgrind.txt
          dest: ctgrind
          status: ok
          summary: no secret-dependent branches under Valgrind
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

