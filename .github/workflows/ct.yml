name: Constant-time

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "benches/dudect.rs"
      - "benches/tacet.rs"
      - "tests/ctgrind.rs"
      - "src/**"
      - ".github/workflows/ct.yml"
  schedule:
    # Weekly, to track the CT signal over time on the dashboard.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  statistical:
    name: dudect + tacet
    runs-on: ubuntu-latest
    # The CT rework has landed: dudect (encaps + decaps) clears |t| < 4.5
    # locally and ctgrind catches secret-dependent branches in keygen and
    # decaps. A regression here should fail the build.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build dudect bench
        run: cargo bench --bench dudect --features expose-internals --no-run
      - name: dudect t-test
        run: |
          # Run the bench binary directly: `cargo bench --bench` passes
          # `--bench` to the harness, which dudect-bencher rejects.
          set -o pipefail
          mkdir -p ct
          bin=$(find target/release/deps -maxdepth 1 -type f -name 'dudect-*' ! -name '*.d' -perm -u+x | head -1)
          "$bin" 2>&1 | tee ct/dudect.txt
      - name: Enforce dudect |t| < 4.5
        run: |
          # dudect-bencher prints `max t = <signed float>` per bench but always
          # exits 0; scrape the report and fail if any reading is at or above
          # the 4.5 threshold (or non-numeric, which means the harness broke).
          awk '
            /max t = / {
              match($0, /max t = [+-]?[0-9]+\.[0-9]+/);
              t = substr($0, RSTART + 8, RLENGTH - 8) + 0;
              if (t < 0) t = -t;
              printf "  %s -> |t| = %.5f\n", $2, t;
              if (t >= 4.5) { print "FAIL: |t| >= 4.5"; bad = 1 }
            }
            END { exit bad ? 1 : 0 }
          ' ct/dudect.txt
      - name: Build tacet bench
        run: cargo bench --bench tacet --features expose-internals --no-run
      - name: tacet attacker-model analysis
        run: |
          set -o pipefail
          bin=$(find target/release/deps -maxdepth 1 -type f -name 'tacet-*' ! -name '*.d' -perm -u+x | head -1)
          "$bin" 2>&1 | tee ct/tacet.txt
      - name: Build dashboard JSON
        run: |
          rustc -O --edition 2021 .github/scripts/dudect-to-json.rs -o /tmp/dudect-to-json
          rustc -O --edition 2021 .github/scripts/tacet-to-json.rs -o /tmp/tacet-to-json
          /tmp/dudect-to-json ct/dudect.txt "${{ github.sha }}" > dudect.json
          /tmp/tacet-to-json ct/tacet.txt "${{ github.sha }}" > tacet.json
      - name: Verify CT payloads have data
        run: |
          jq -e '.total > 0' dudect.json > /dev/null || { echo "::error::dudect.json has no t-test results"; cat dudect.json >&2; exit 1; }
          jq -e '.total > 0' tacet.json > /dev/null || { echo "::error::tacet.json has no leak-model results"; cat tacet.json >&2; exit 1; }
      - name: Upload dudect to dashboard
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/ci-upload
        with:
          kind: dudect
          payload: dudect.json
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}
      - name: Upload tacet to dashboard
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/ci-upload
        with:
          kind: tacet
          payload: tacet.json
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

  ctgrind:
    name: ctgrind (Valgrind taint tracking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind
      - name: Run per-test memcheck report
        # ctgrind-report builds tests/ctgrind.rs (release: debug-mode
        # overflow checks insert conditional jumps that Valgrind flags as
        # secret-dependent), runs each test individually under memcheck
        # with XML output so errors map to specific functions, writes the
        # dashboard JSON, and exits nonzero on any leak or broken harness.
        run: |
          rustc -O --edition 2021 .github/scripts/ctgrind-report.rs -o /tmp/ctgrind-report
          /tmp/ctgrind-report "${{ github.sha }}" > ctgrind.json
      - name: Verify ctgrind payload has data
        if: always()
        run: jq -e '.tests > 0' ctgrind.json > /dev/null || { echo "::error::ctgrind.json has no test results"; cat ctgrind.json >&2; exit 1; }
      - name: Upload to dashboard
        if: always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: ./.github/actions/ci-upload
        with:
          kind: ctgrind
          payload: ctgrind.json
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

