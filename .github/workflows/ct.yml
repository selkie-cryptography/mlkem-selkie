name: Constant-time

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "benches/tacet.rs"
      - "tests/ctgrind.rs"
      - "src/**"
      - ".github/workflows/ct.yml"
      # Scripts the workflow compiles-and-runs; a change to the gate or the
      # dashboard converters is a CT-relevant change and needs CI validation.
      - ".github/scripts/tacet-to-json.rs"
      - ".github/scripts/ctgrind-report.rs"
  schedule:
    # Weekly, to track the CT signal over time on the dashboard.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  statistical:
    name: tacet
    runs-on: ubuntu-latest
    # tacet's attacker-model analysis and ctgrind's taint tracking gate CT
    # regressions; a failure here should fail the build.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e  # v2
      - name: Build tacet bench
        run: cargo bench --bench tacet --features expose-internals --no-run
      - name: tacet attacker-model analysis
        run: |
          set -o pipefail
          mkdir -p ct
          bin=$(find target/release/deps -maxdepth 1 -type f -name 'tacet-*' ! -name '*.d' -perm -u+x | head -1)
          "$bin" 2>&1 | tee ct/tacet.txt
      - name: Build dashboard JSON
        run: |
          rustc -O --edition 2021 .github/scripts/tacet-to-json.rs -o /tmp/tacet-to-json
          /tmp/tacet-to-json ct/tacet.txt "${{ github.sha }}" > tacet.json
      - name: Verify CT payload has data
        run: |
          jq -e '.total > 0' tacet.json > /dev/null || { echo "::error::tacet.json has no leak-model results"; cat tacet.json >&2; exit 1; }
      - name: Upload tacet to dashboard
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/ci-upload
        with:
          kind: tacet
          payload: tacet.json
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

  ctgrind:
    name: ctgrind (Valgrind taint tracking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e  # v2
      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind
      - name: Run per-test memcheck report
        # ctgrind-report builds tests/ctgrind.rs (release: debug-mode
        # overflow checks insert conditional jumps that Valgrind flags as
        # secret-dependent), runs each test individually under memcheck
        # with XML output so errors map to specific functions, writes the
        # dashboard JSON, and exits nonzero on any leak or broken harness.
        run: |
          rustc -O --edition 2021 .github/scripts/ctgrind-report.rs -o /tmp/ctgrind-report
          /tmp/ctgrind-report "${{ github.sha }}" > ctgrind.json
      - name: Verify ctgrind payload has data
        if: always()
        run: jq -e '.tests > 0' ctgrind.json > /dev/null || { echo "::error::ctgrind.json has no test results"; cat ctgrind.json >&2; exit 1; }
      - name: Upload to dashboard
        if: always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: ./.github/actions/ci-upload
        with:
          kind: ctgrind
          payload: ctgrind.json
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

