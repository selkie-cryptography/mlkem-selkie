name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all --check

  clippy:
    name: clippy (${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # One entry per polynomial backend build.rs can select. `RUSTFLAGS` drives
      # that choice: empty leaves the portable backend on x86 and NEON on the
      # aarch64 macOS runner; `target-cpu=x86-64-v3` adds AVX2 on x86. The
      # backend is a cfg, not a cargo feature, so `--all-features` alone would
      # only ever lint the portable kernels.
      matrix:
        include:
          - { backend: portable, os: ubuntu-latest, rustflags: "" }
          - { backend: neon, os: macos-latest, rustflags: "" }
          - { backend: avx2, os: ubuntu-latest, rustflags: "-C target-cpu=x86-64-v3" }
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Beta clippy: the lint set stable enforces next.
      - uses: dtolnay/rust-toolchain@beta
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (default features)
        run: cargo clippy --all-targets
      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features

  doc:
    name: doc (${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { backend: portable, os: ubuntu-latest, rustflags: "" }
          - { backend: neon, os: macos-latest, rustflags: "" }
          - { backend: avx2, os: ubuntu-latest, rustflags: "-C target-cpu=x86-64-v3" }
    env:
      # rustdoc has its own flag path; `build.warnings = "deny"` covers cargo
      # commands but not rustdoc, so this stays.
      RUSTDOCFLAGS: -D warnings
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --document-private-items --all-features
      - name: Publish rustdoc to dashboard
        # One leg is plenty — rustdoc is backend-independent prose.
        if: matrix.backend == 'portable' && github.event_name == 'push'
        uses: ./.github/actions/ci-publish
        with:
          path: target/doc
          dest: rustdoc
          status: ok
          summary: rustdoc (private items included)
          landing-path: mlkem_selkie/
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

  test:
    name: test (portable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - name: Test (default features)
        run: cargo nextest run --cargo-profile release-checked
      - name: Test (expose-internals)
        run: cargo nextest run --cargo-profile release-checked --features expose-internals
      # Doc tests: nextest does not run them; fall back to the built-in harness.
      - name: Doctests
        run: cargo test --doc

  test-neon:
    name: test (neon)
    # Apple Silicon runners are aarch64, where NEON is baseline, so build.rs
    # selects the NEON polynomial backend and its differential tests
    # (poly/arch/neon) run against the scalar backend here.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - name: Test (default features)
        run: cargo nextest run --cargo-profile release-checked
      - name: Test (NEON backend, expose-internals)
        run: cargo nextest run --cargo-profile release-checked --features expose-internals
      - name: Doctests
        run: cargo test --doc

  test-avx2:
    name: test (avx2)
    runs-on: ubuntu-latest
    # Raise the baseline to x86-64-v3 so build.rs selects the AVX2 polynomial
    # backend; the GitHub x86_64 runners support AVX2, so its differential tests
    # (poly/arch/avx2) run against the scalar backend here. `RUSTFLAGS` is set in
    # the job (it overrides .cargo/config.toml's target rustflags).
    env:
      RUSTFLAGS: "-C target-cpu=x86-64-v3"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - name: Test (AVX2 backend, expose-internals)
        run: cargo nextest run --cargo-profile release-checked --features expose-internals

  feature-combinations:
    name: Feature combinations build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build with no parameter sets
        run: cargo build --no-default-features
      - name: Build each parameter set alone
        run: |
          for set in mlkem512 mlkem768 mlkem1024; do
            cargo build --no-default-features --features "$set"
          done
      - name: Build with internals exposed
        run: cargo build --no-default-features --features mlkem768,expose-internals

  benches-compile:
    name: Benchmarks compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --no-run --features expose-internals

  # Re-runs the vector + interop suites under nextest for the JUnit XML the
  # dashboard's Conformance panel is built from. Main pushes only — the
  # same tests already gate PRs via the test jobs above.
  vectors:
    name: Conformance suites (dashboard)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - name: Run vector + interop suites (JUnit)
        run: |
          cargo nextest run --profile vectors --cargo-profile release-checked \
            --test wycheproof --test kats --test libcrux_xtest --test boringssl_xtest
      - name: Build dashboard JSON
        run: |
          rustc -O --edition 2021 .github/scripts/kat-report.rs -o /tmp/kat-report
          /tmp/kat-report "${{ github.sha }}" target/nextest/vectors/junit.xml > kat.json
      - name: Verify kat payload has data
        run: jq -e '.suites | length > 0' kat.json > /dev/null || { echo "::error::kat.json has no suites"; cat kat.json >&2; exit 1; }
      - name: Upload to dashboard
        if: github.event_name == 'push'
        uses: ./.github/actions/ci-upload
        with:
          kind: kat
          payload: kat.json
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

  # Census of `unsafe` lines per module (the SIMD kernels need intrinsics;
  # the dashboard's Audits panel watches for growth).
  unsafe-count:
    name: unsafe usage census
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build dashboard JSON
        run: |
          rustc -O --edition 2021 .github/scripts/unsafe-count.rs -o /tmp/unsafe-count
          /tmp/unsafe-count "${{ github.sha }}" > unsafe.json
          cat unsafe.json
      - name: Upload to dashboard
        if: github.event_name == 'push'
        uses: ./.github/actions/ci-upload
        with:
          kind: unsafe
          payload: unsafe.json
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

  # Summarizes the per-backend test jobs above for the dashboard's
  # Platforms panel, via the Actions REST API.
  platform-report:
    name: Platform matrix report
    needs: [test, test-neon, test-avx2]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build dashboard JSON
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rustc -O --edition 2021 .github/scripts/platform-report.rs -o /tmp/platform-report
          /tmp/platform-report "${{ github.run_id }}" "${{ github.sha }}" > platform.json
      - name: Verify platform payload has data
        run: jq -e '.platforms | length > 0' platform.json > /dev/null || { echo "::error::platform.json has no jobs"; cat platform.json >&2; exit 1; }
      - name: Upload to dashboard
        uses: ./.github/actions/ci-upload
        with:
          kind: platform
          payload: platform.json
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}
