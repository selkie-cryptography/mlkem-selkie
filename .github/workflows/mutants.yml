name: Mutants

on:
  pull_request:
  schedule:
    # Weekly full-tree run, published to the dashboard.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # sccache turns per-mutant rustc re-invocations into cache hits; the GHA
  # backend persists across jobs on the same runner arch. Doubles the cost
  # savings from `-j 4` below.
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  incremental:
    name: cargo-mutants (changed code)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,cargo-nextest
      - uses: mozilla-actions/sccache-action@v0.0.5
      - uses: Swatinem/rust-cache@v2
      - name: Mutate only the PR diff
        # `-j 4` matches the ubuntu-latest 4-vCPU runner. Each mutant is a
        # single-threaded compile + short test, so raising from `-j 2` roughly
        # halves wall-time; sccache above catches the rustc-level redundancy
        # the parallelism exposes.
        run: |
          git diff "origin/${{ github.base_ref }}" > pr.diff
          cargo mutants --no-shuffle -j 4 --in-diff pr.diff
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-out
          path: mutants.out

  full:
    name: cargo-mutants (full tree, ${{ matrix.arch }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64: covers the AVX2 backend and the scalar core.
          - arch: x86_64
            runner: ubuntu-latest
            dest: mutants
          # aarch64 (Apple Silicon): covers `src/algebraic/poly/arch/neon.rs`,
          # which is `cfg(target_arch = "aarch64")` and never compiles on the
          # ubuntu runner.
          - arch: aarch64
            runner: macos-latest
            dest: mutants-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,cargo-nextest
      - uses: mozilla-actions/sccache-action@v0.0.5
      - uses: Swatinem/rust-cache@v2
      - name: Run full mutation testing
        # Don't fail the job on surviving mutants — summarize and publish them.
        # `-j 4` on x86_64 ubuntu / macOS runners (both are 4-vCPU tiers).
        run: cargo mutants --no-shuffle -j 4 || true
      - name: Summarize
        run: |
          caught=$(wc -l < mutants.out/caught.txt 2>/dev/null || echo 0)
          missed=$(wc -l < mutants.out/missed.txt 2>/dev/null || echo 0)
          viable=$((caught + missed))
          score=0
          [ "$viable" -gt 0 ] && score=$((100 * caught / viable))
          # `viable == 0` means the baseline build/test failed (or no mutants
          # were emitted) — `cargo mutants || true` swallows the exit code, so
          # without this arm a broken baseline would pass silently (the
          # ci-upload floor also rejects an empty payload).
          if [ "$viable" -eq 0 ]; then
            echo "no mutants tested (baseline failed?)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "caught $caught/$viable ($score%)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build dashboard JSON
        if: always()
        run: |
          rustc -O --edition 2021 .github/scripts/mutants-to-json.rs -o /tmp/mutants-to-json
          /tmp/mutants-to-json mutants.out/outcomes.json "${{ github.sha }}" > mutants.json
      - name: Upload to dashboard
        if: always()
        uses: ./.github/actions/ci-upload
        with:
          kind: ${{ matrix.dest }}
          payload: mutants.json
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}
