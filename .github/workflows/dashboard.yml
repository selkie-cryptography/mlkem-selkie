name: Deploy dashboard

# Deploys the CI/status site under `.github/site/` (an nginx:alpine container)
# to Fly, matching the sibling sqisign-selkie. The workflows publish their report
# artifacts to the Fly volume, which nginx serves under /data/<category>/.
#
# Requires the `FLY_API_TOKEN` repository secret and a Fly app named
# `mlkem-selkie-ci` (see .github/site/fly.toml).

on:
  push:
    branches: [main]
    paths:
      - ".github/site/**"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy CI site to Fly
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        working-directory: .github/site
        run: flyctl deploy --remote-only
