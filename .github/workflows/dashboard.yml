name: Deploy dashboard

# Publishes the static CI/status dashboard under `.github/site/` to GitHub
# Pages. (The sibling sqisign-selkie deploys an equivalent site to Fly; Pages is
# the portable, infrastructure-free equivalent for this crate.)

on:
  push:
    branches: [main]
    paths:
      - ".github/site/**"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy CI site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .github/site
      - id: deployment
        uses: actions/deploy-pages@v4
