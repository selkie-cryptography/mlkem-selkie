name: Deploy dashboard

# Deploys the CI dashboard under `.github/site/` (an nginx:alpine container)
# to Fly, ported from the sibling sqisign-selkie. The workflows publish JSON
# payloads to the Fly volume via .github/scripts/ci-upload.rs, which nginx
# serves under /data/<kind>/.
#
# Requires the `FLY_API_TOKEN` repository secret and a Fly app named
# `mlkem-selkie-ci` (see .github/site/fly.toml).

on:
  push:
    branches: [main]
    paths:
      - ".github/site/**"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy CI site to Fly
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1  # master
      - name: Deploy to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        working-directory: .github/site
        run: flyctl deploy --remote-only
