# Monthly, one PR per ecosystem; security updates skip the schedule.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/ci-upload", "/.github/actions/ci-publish"]
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      # Majors stay separate: they usually need code changes.
      cargo:
        update-types: ["minor", "patch"]
