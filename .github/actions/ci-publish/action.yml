name: Publish CI report to Fly
description: >-
  Ships a file or directory to the Fly CI-site volume under /data/<dest>/, where
  nginx serves it at https://<app>.fly.dev/<dest>/. Used for whole-tree payloads
  like rustdoc; the dashboard's JSON kinds go through .github/actions/ci-upload
  instead. Tarballs the payload, uploads it over `flyctl ssh sftp`, and extracts
  it on the machine. Gate the calling step with `if:` (publish from main pushes
  / schedules only).

inputs:
  path:
    description: Local file or directory to publish.
    required: true
  dest:
    description: Destination category under /data (e.g. `coverage`, `bench`).
    required: true
  status:
    description: "Dashboard status: ok | warn | fail."
    required: false
    default: ok
  summary:
    description: One-line summary shown on the dashboard card.
    required: false
    default: ""
  landing-path:
    description: >-
      Relative path (under `dest`) to link the dashboard card at. Use when the
      published report has no `index.html`, so nginx's `autoindex off` would
      return 403 for the bare directory URL. Example: `missed.txt` for
      cargo-mutants. Leave empty when the report contains its own `index.html`.
    required: false
    default: ""
  fly-app:
    description: Fly app hosting the CI site.
    required: false
    default: mlkem-selkie-ci
  fly-api-token:
    description: Fly API token with deploy access to the CI-site app.
    required: true

runs:
  using: composite
  steps:
    - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1  # master
    - name: Upload to CI site
      shell: bash
      env:
        FLY_API_TOKEN: ${{ inputs.fly-api-token }}
        APP: ${{ inputs.fly-app }}
        SRC: ${{ inputs.path }}
        DEST: ${{ inputs.dest }}
        STATUS: ${{ inputs.status }}
        SUMMARY: ${{ inputs.summary }}
        LANDING: ${{ inputs.landing-path }}
        SHA: ${{ github.sha }}
      run: |
        set -euo pipefail

        if [ ! -e "$SRC" ]; then
          echo "::warning::ci-publish: $SRC does not exist; skipping"
          exit 0
        fi

        # Stage the payload plus a status.json the dashboard reads.
        stage="$(mktemp -d)"
        if [ -d "$SRC" ]; then
          cp -a "$SRC/." "$stage/"
        else
          cp -a "$SRC" "$stage/"
        fi
        # Nginx serves this via `autoindex off`, so the dashboard's card must
        # point at a real file when no `index.html` was uploaded — otherwise
        # the bare `/$DEST/` URL 403s. `LANDING` gives each publish job that
        # choice; empty means the payload has its own `index.html`.
        url="/$DEST/"
        if [ -n "$LANDING" ]; then
          url="/$DEST/$LANDING"
        fi
        jq -n \
          --arg status "$STATUS" \
          --arg summary "$SUMMARY" \
          --arg sha "$SHA" \
          --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --arg url "$url" \
          '{status: $status, summary: $summary, sha: $sha, timestamp: $ts, url: $url}' \
          > "$stage/status.json"

        tar czf /tmp/_payload.tgz -C "$stage" .

        # Wake / wait for the Fly app before SSH. `auto_start_machines = true`
        # boots a stopped machine on HTTP; SSH does not trigger auto-start and
        # errors out with "no started VMs" during a `dashboard.yml` redeploy
        # window if the publish job happens to land inside it. `curl` retries
        # cover cold-start (~30-60s) and connection resets during the deploy.
        curl -sSf --max-time 20 \
          --retry 8 --retry-delay 10 --retry-connrefused \
          "https://$APP.fly.dev/" > /dev/null

        # `flyctl ssh` can still miss the window between the HTTP 200 above and
        # the SSH attempt (the machine may briefly churn during a redeploy).
        # Retry each ssh/sftp call with backoff before failing the step.
        fly_retry() {
          local attempt
          for attempt in 1 2 3 4 5; do
            if "$@"; then return 0; fi
            echo "::warning::ci-publish: ${1} attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          echo "::error::ci-publish: giving up on ${1} after 5 attempts"
          return 1
        }

        # Ensure the destination directory exists: the site entrypoint.sh only
        # pre-creates the long-standing categories, so a new `dest` (e.g. a
        # per-backend `bench-neon`) has no directory for SFTP to put into.
        fly_retry flyctl ssh console -a "$APP" -C "/bin/sh -c 'mkdir -p /data/$DEST'"
        # Push the tarball over SFTP, then extract it on the machine.
        sftp_put() {
          printf 'put /tmp/_payload.tgz /data/%s/_payload.tgz\n' "$DEST" \
            | flyctl ssh sftp shell -a "$APP"
        }
        fly_retry sftp_put
        fly_retry flyctl ssh console -a "$APP" -C \
          "/bin/sh -c 'cd /data/$DEST && tar xzf _payload.tgz && rm -f _payload.tgz'"

        echo "published $SRC ($STATUS) -> https://$APP.fly.dev/$DEST/"
