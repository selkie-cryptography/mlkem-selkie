# cargo-deny configuration. https://embarkstudios.github.io/cargo-deny/

[advisories]
# `vulnerability` was removed — all vulnerabilities are now errors. Flag
# unmaintained advisories for first-party (workspace) crates only, so transitive
# dev-dependency churn (ansi_term, proc-macro-error, ...) does not fail the build.
unmaintained = "workspace"
yanked = "deny"

[bans]
# Warn on duplicate versions outside dev-dependencies.
# rand's dev-only duplicates don't count: proptest and tacet pull 0.9, and
# nalgebra and statrs (via tacet) pull 0.8.
multiple-versions = "warn"
wildcards = "deny"

[licenses]
# Permissive licenses acceptable for an Apache-2.0 OR MIT crate.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# Only these crates may run build scripts. A new one fails `cargo deny check`
# until someone reviews its build.rs and adds it here.
[bans.build]
executables = "deny"
allow-build-scripts = [
    "alloca",
    "bindgen",
    "clang-sys",
    "crabgrind",
    "crossbeam-epoch",
    "crossbeam-utils",
    "crunchy",
    "getrandom",
    "gungraun",
    "gungraun-macros",
    "hax-lib",
    "kperf-sys",
    "libc",
    "libcrux-intrinsics",
    "libcrux-ml-kem",
    "libcrux-sha3",
    "libm",
    "matrixmultiply",
    "memoffset",
    "num-traits",
    "object",
    "parking_lot_core",
    "paste",
    "prettyplease",
    "proc-macro2",
    "rayon-core",
    "rustix",
    "rustversion",
    "serde",
    "serde_core",
    "serde_json",
    "sha3-selkie",
    "wasm-bindgen",
    "wasm-bindgen-shared",
    "winapi",
    "winapi-i686-pc-windows-gnu",
    "winapi-x86_64-pc-windows-gnu",
    "wit-bindgen",
    "zerocopy",
    "zmij",
]
