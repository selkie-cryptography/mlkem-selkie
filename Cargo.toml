[package]
name = "mlkem-selkie"
version = "0.0.0"
edition = "2021"
# Floor set by sha3-selkie, where the AVX-512 intrinsics stabilized.
rust-version = "1.89"
authors = ["Deirdre Connolly <durumcrustulum@gmail.com>"]
description = "Rust ML-KEM (FIPS 203) implementation for beautiful, secure code; pretty fast."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/selkie-cryptography/mlkem-selkie"
homepage = "https://selkiecryptography.com"
documentation = "https://docs.rs/mlkem-selkie"
keywords = ["cryptography", "post-quantum", "ml-kem", "kyber", "fips203"]
categories = ["cryptography"]
# Dev-only trees: the llvm-mca driver and the BoringSSL cross-test oracle.
# Not needed to build or use the crate, so keep them out of the published
# `.crate`. CI config isn't needed either, nor `tests/`: the ~9 MiB of
# ACVP/KAT vector JSON dominates the package, and `kats.rs` / `wycheproof.rs`
# `include_str!` it, so shipping those without the vectors would not compile.
exclude = ["scripts/", "tools/", ".github", "tests/"]

[features]
default = ["mlkem512", "mlkem768", "mlkem1024"]
mlkem512 = []
mlkem768 = []
mlkem1024 = []
# Re-expose internal modules as `pub` for white-box tests, fuzzing, benchmarks.
expose-internals = []
ctgrind = ["expose-internals"]
dhat-heap = []

[dependencies]
getrandom = "0.2"
sha3-selkie = "0.0.0"
subtle = "2"
zeroize = { version = "1.7.0", features = ["derive"] }

[dev-dependencies]
mlkem-selkie = { path = ".", features = ["expose-internals"] }
hex = "0.4"
libcrux-ml-kem = { version = "0.0.10", default-features = false, features = [
    "mlkem512",
    "mlkem768",
    "mlkem1024",
] }
rand = "0.10"
# The cross-test oracles seed their RNG through these traits; the library
# itself takes entropy from `getrandom`.
rand_core = "0.6"
# Deterministic PRNG for the randomized interop tests.
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
divan = "0.1"
dhat = "0.3"
proptest = "1"
mutants = "0.0.4"
tacet = "0.4"
gungraun = "0.19"

# x86_64-only: rdtsc bench has no unprivileged cycle source on aarch64.
[target.'cfg(target_arch = "x86_64")'.dev-dependencies]
criterion = "0.8"
criterion-cycles-per-byte = "0.8"

# Linux-only: crabgrind needs <valgrind/valgrind.h>. Used by the ctgrind test
# and to declassify `rho` under memcheck.
[target.'cfg(target_os = "linux")'.dependencies]
crabgrind = { version = "0.2", optional = true }

[[test]]
name = "algebraic_properties"
required-features = ["expose-internals"]

[[test]]
name = "ctgrind"
required-features = ["ctgrind"]

[[bench]]
name = "mlkem"
harness = false

# Internal hot paths, not the shipped API: `cargo bench --bench algebraic`.
[[bench]]
name = "algebraic"
harness = false
bench = false
required-features = ["expose-internals"]

[[bench]]
name = "tacet"
harness = false
required-features = ["expose-internals"]

# Needs valgrind/callgrind under gungraun, so not part of a default run:
# `cargo bench --bench instructions`.
[[bench]]
name = "instructions"
harness = false
bench = false
required-features = ["expose-internals"]

# x86_64-only at runtime; skip stub elsewhere.
[[bench]]
name = "cycles"
harness = false

# Release + debuginfo for flamegraphs / samply / dhat.
[profile.profiling]
inherits = "release"
debug = true

# Release optimization with overflow-checks and debug-assertions retained,
# for use in CI.
[profile.release-checked]
inherits = "release"
debug-assertions = true
overflow-checks = true

# cargo-mutants, with `.cargo/mutants.toml`. `opt-level = 1` and
# `incremental = true` cut per-mutant rustc time: each mutant edits one
# function, so incremental rebuilds one codegen unit. `release-checked`'s
# `debug-assertions` and `overflow-checks` catch arithmetic mutants.
[profile.mutants]
inherits = "release-checked"
debug = "none"
opt-level = 1
incremental = true
