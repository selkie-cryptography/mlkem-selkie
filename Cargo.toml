[package]
name = "mlkem-selkie"
version = "0.1.0"
edition = "2021"
authors = ["Deirdre Connolly <durumcrustulum@gmail.com>"]
description = "Rust ML-KEM (FIPS 203) implementation for beautiful, secure code."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/selkie-cryptography/mlkem-selkie"
homepage = "https://selkiecryptography.com"
documentation = "https://docs.rs/mlkem-selkie"
# crates.io caps keywords at five.
keywords = ["cryptography", "post-quantum", "ml-kem", "kyber", "fips203"]
categories = ["cryptography"]
# Dev-only trees: the llvm-mca driver and the BoringSSL cross-test oracle.
# Not needed to build or use the crate, so keep them out of the published
# `.crate`.
exclude = ["scripts/", "tools/"]

[features]
default = ["mlkem512", "mlkem768", "mlkem1024"]
mlkem512 = []
mlkem768 = []
mlkem1024 = []
# Re-expose internal modules as `pub` for white-box tests, fuzzing, benchmarks.
expose-internals = []
# Enables `tests/ctgrind.rs` only under the dedicated Constant-time workflow.
ctgrind = ["expose-internals"]
dhat-heap = []

[dependencies]
getrandom = "0.2"
rand_core = "0.6"
# Pinned to `=0.0.10`: pre-1.0 crate on the crypto-critical path.
libcrux-sha3 = { version = "=0.0.10", default-features = false }
subtle = "2"
zeroize = { version = "1.7.0", features = ["derive"] }

# Batched SIMD Keccak for parallel SHAKE streams; layered on top of the scalar
# `libcrux-sha3` above.
[target.'cfg(all(target_arch = "aarch64", target_feature = "neon"))'.dependencies]
libcrux-sha3 = { version = "=0.0.10", default-features = false, features = ["simd128"] }

[target.'cfg(all(target_arch = "x86_64", target_feature = "avx2"))'.dependencies]
libcrux-sha3 = { version = "=0.0.10", default-features = false, features = ["simd256"] }

[dev-dependencies]
# Self dev-dep so `expose-internals` is active for tests/benches/examples
# without leaking into the default public build. Path-only, no `version`:
# cargo strips it from the published manifest (a versioned self dev-dep
# can't resolve during a first-of-its-version publish).
mlkem-selkie = { path = ".", features = ["expose-internals"] }
hex = "0.4"
libcrux-ml-kem = { version = "0.0.10", default-features = false, features = [
    "mlkem512",
    "mlkem768",
    "mlkem1024",
] }
rand = "0.8"
# Deterministic PRNG for the randomized interop tests and the dudect bench.
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
divan = "0.1"
dhat = "0.3"
proptest = "1"
mutants = "0.0.4"
dudect-bencher = "0.7"
tacet = "0.4"
gungraun = "0.19"

# x86_64-only: rdtsc bench has no unprivileged cycle source on aarch64.
[target.'cfg(target_arch = "x86_64")'.dev-dependencies]
criterion = "0.8"
criterion-cycles-per-byte = "0.8"

# Linux-only: crabgrind needs <valgrind/valgrind.h>. Used by the ctgrind test
# and, in-crate, to declassify `rho` under memcheck.
[target.'cfg(target_os = "linux")'.dependencies]
crabgrind = { version = "0.2", optional = true }

[[test]]
name = "algebraic_properties"
required-features = ["expose-internals"]

[[test]]
name = "ctgrind"
required-features = ["ctgrind"]

[[bench]]
name = "mlkem"
harness = false

[[bench]]
name = "algebraic"
harness = false
required-features = ["expose-internals"]

[[bench]]
name = "dudect"
harness = false
required-features = ["expose-internals"]

[[bench]]
name = "tacet"
harness = false
required-features = ["expose-internals"]

[[bench]]
name = "instructions"
harness = false
required-features = ["expose-internals"]

# x86_64-only at runtime; skip stub elsewhere.
[[bench]]
name = "cycles"
harness = false

# Release + debuginfo for flamegraphs / samply / dhat.
[profile.profiling]
inherits = "release"
debug = true

# Release optimization with overflow-checks + debug-assertions retained, for CI.
[profile.release-checked]
inherits = "release"
debug-assertions = true
overflow-checks = true

# cargo-mutants: cut per-mutant rustc time with `opt-level = 1` and
# `incremental = true`. Mutation signal is opt-invariant; `debug-assertions`
# and `overflow-checks` from `release-checked` are what catch arithmetic
# mutants. `incremental` is off by default here (inherited from `release`), but
# a mutation run is thousands of single-function edits to the same crate reverted
# back to baseline each time — the best case for incremental, so each mutant
# recompiles only the changed codegen unit instead of the whole lib (~2x faster
# per mutant, measured). Cranelift is layered on top via
# `CARGO_PROFILE_MUTANTS_CODEGEN_BACKEND=cranelift` in the mutants workflow —
# keeping it out of the manifest so stable Cargo never sees the unstable profile
# key. Pairs with `.cargo/mutants.toml`.
[profile.mutants]
inherits = "release-checked"
debug = "none"
opt-level = 1
incremental = true
