[package]
name = "mlkem-selkie"
version = "0.1.0"
edition = "2021"
authors = ["Deirdre Connolly <durumcrustulum@gmail.com>"]
description = "Rust ML-KEM (FIPS 203) implementation for beautiful, secure code."
license = "Apache-2.0 OR MIT"
keywords = ["cryptography", "post-quantum", "quantum-resistant",
            "quantum-resilient", "mlkem", "ml-kem", "fips203", "kyber"]

[features]
# Enable to expose test-only functionality
test = []

[dependencies]
# Provides NIST 800-90A compliant CTR_DRBG implementation using AES via RustCrypto
drbg = "0.2.0"
# libcrux = "0.0.1"
rand = "0.8.5"
sha3 = "0.10.8"
zeroize = "1.7.0"

# When using the hax toolchain, we have more dependencies.  This is only
# required when doing proofs.
[target.'cfg(hax)'.dependencies]
hax-lib-macros = { version = "0.1.0-pre.1", git = "https://github.com/hacspec/hax" }
